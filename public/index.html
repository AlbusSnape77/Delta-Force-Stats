<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三角洲 玩家档案本</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>三角洲 · 烽火地带 玩家档案本</h1>
    <input id="search" type="text" placeholder="输入游戏 ID / 昵称搜索…" autocomplete="off" />
  </header>

  <main id="results"></main>

  <button id="add-btn" class="fab" title="记一笔新玩家">＋</button>

  <dialog id="form-dialog">
    <form id="player-form" method="dialog">
      <h2 id="form-title">记一笔</h2>
      <label>游戏 ID *<input name="game_id" required /></label>
      <label>标签（逗号分隔）<input name="tags" placeholder="老六, 车队" /></label>
      <label>段位/等级<input name="rank" /></label>
      <label>总场次<input name="matches" type="number" min="0" /></label>
      <label>撤离成功次数<input name="escape_count" type="number" min="0" /></label>
      <label>撤离率(%)<input name="escape_rate" type="number" min="0" max="100" step="0.1" /></label>
      <label>击杀<input name="kills" type="number" min="0" /></label>
      <label>死亡<input name="deaths" type="number" min="0" /></label>
      <label>累计资产/收益<input name="net_profit" type="number" min="0" /></label>
      <label>常用干员<input name="favorite_operator" /></label>
      <label>备注<textarea name="note" rows="2"></textarea></label>
      <p id="form-error" class="error"></p>
      <menu>
        <button type="button" id="cancel-btn">取消</button>
        <button type="submit" id="save-btn">保存</button>
      </menu>
    </form>
  </dialog>

  <dialog id="confirm-dialog">
    <p id="confirm-text">确定删除这个玩家档案？</p>
    <menu>
      <button type="button" id="confirm-cancel">取消</button>
      <button type="button" id="confirm-ok" class="danger">删除</button>
    </menu>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
