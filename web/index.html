<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三角洲 · 战绩分析器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 指挥栏:品牌 + 查询(主入口) + 状态 -->
  <header id="topbar">
    <div class="brand">
      <span class="mark">◢◤</span>
      <span class="bn">DELTA<b>STATS</b></span>
      <span class="bsub">烽火地带 · 战绩分析</span>
    </div>
    <div class="cmd">
      <input id="al-input" placeholder="输入对方昵称或编号(UID)，回车查询" autocomplete="off" />
      <button id="al-go">查 询</button>
      <button id="al-stop" hidden>停止</button>
    </div>
    <div class="top-meta">
      <span id="al-stats"></span>
      <a class="al-cal" href="/calibrate.html" target="_blank">校准</a>
    </div>
  </header>
  <div id="al-status"></div>

  <!-- 备用入口:手动上传截图(默认收起;粘贴图片自动展开) -->
  <details id="upload">
    <summary>手动上传截图 <span class="sum-hint">备用 · 拖入或 Ctrl+V 粘贴 4 张资料页截图</span></summary>
    <div id="drop">
      <input id="files" type="file" accept="image/*" multiple />
      <div class="hint">拖入 / 粘贴(Ctrl+V) / 选择 4 张截图（数据总览·排位赛·最近战绩·首页），顺序随意</div>
      <div id="thumbs"></div>
      <div class="row">
        <span>已选 <span id="count">0</span> 张</span>
        <button id="analyze">识别并记录</button>
        <button id="clear" class="ghost">清空</button>
      </div>
      <div id="upmsg"></div>
    </div>
  </details>

  <!-- 主区:左花名册 + 右档案 -->
  <div id="layout">
    <aside id="rail">
      <input id="search" type="text" placeholder="筛选花名册…" autocomplete="off" />
      <main id="list"></main>
    </aside>
    <main id="result"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
